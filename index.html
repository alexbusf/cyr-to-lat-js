<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Транслит</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    
                    <h4 class="text-center mb-4">Транслит</h4>

                    <div class="mb-3">
                        <label for="cyrillic" class="form-label">Введите текст на кириллице:</label>
                        <textarea class="form-control" id="cyrillic" rows="3" placeholder="Например: Привет как дела"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="latin" class="form-label">Результат в латинице:</label>
                        <input type="text" class="form-control" id="latin" placeholder="Здесь появится результат" readonly>
                    </div>

                    <!-- КНОПКА КОПИРОВАНИЯ -->
                    <div class="d-grid">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="copyBtn">Copy</button>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/translit.js" defer></script>
<!-- НОВЫЙ СКРИПТ ДЛЯ КНОПКИ -->
<script src="js/copy.js" defer></script>

</body>
</html>
